<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홈 화면 · C 테라코타</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Noto Sans KR', 'Pretendard', sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden">

  <div style="display: flex; flex-direction: column; gap: 22px; padding: 56px 20px 20px; flex: 1 1 auto; overflow: hidden">

    <div style="display: flex; align-items: flex-start; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 13px; color: {{c.sub}}">10월 20일 화요일</div>
        <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.5px">오늘 뭐 해 먹지</div>
      </div>
      <button aria-label="테마 전환" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{c.surface}}; color: {{c.sub}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"></path></svg>
      </button>
    </div>

    <div style="display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-radius: 14px; background: {{c.surface}}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.primary}}" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M5 10h14M9 7v0M9 14v0"></path></svg>
      <div style="font-size: 14px; flex: 1">냉장고 재료 23개</div>
      <div style="font-size: 13px; color: {{c.sub}}">지금 가능 12 · 1개만 사면 9</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <div style="font-size: 16px; font-weight: 700">지금 바로 가능</div>
        <a href="#list" style="font-size: 13px; color: {{c.primary}}">12개 모두</a>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: {{c.surface}}">
        <div style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0">
          <div style="font-size: 17px; font-weight: 500">김치찌개</div>
          <div style="font-size: 12px; color: {{c.sub}}">32분 · 1인분 · 보통</div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            <span style="font-size: 11px; padding: 3px 9px; border-radius: 999px; background: {{c.chip}}; color: {{c.chipText}}">배추김치</span>
            <span style="font-size: 11px; padding: 3px 9px; border-radius: 999px; background: {{c.chip}}; color: {{c.chipText}}">돼지 앞다리살</span>
            <span style="font-size: 11px; padding: 3px 9px; border-radius: 999px; background: {{c.chipMuted}}; color: {{c.sub}}">두부</span>
          </div>
        </div>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.sub}}" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: {{c.surface}}">
        <div style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0">
          <div style="font-size: 17px; font-weight: 500">제육볶음</div>
          <div style="font-size: 12px; color: {{c.sub}}">20분 · 1인분 · 보통</div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            <span style="font-size: 11px; padding: 3px 9px; border-radius: 999px; background: {{c.chip}}; color: {{c.chipText}}">돼지 앞다리살</span>
            <span style="font-size: 11px; padding: 3px 9px; border-radius: 999px; background: {{c.chip}}; color: {{c.chipText}}">고추장</span>
            <span style="font-size: 11px; padding: 3px 9px; border-radius: 999px; background: {{c.chipMuted}}; color: {{c.sub}}">양파</span>
          </div>
        </div>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.sub}}" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: {{c.discBg}}">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: {{c.discLabel}}">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
        오늘의 발견
      </div>
      <div style="font-size: 20px; font-weight: 700; color: {{c.discText}}">토마토달걀볶음</div>
      <div style="font-size: 13px; line-height: 1.5; color: {{c.discLabel}}">달걀과 토마토만 있으면 되는 중국 가정식이에요. 13분이면 끝나요.</div>
      <div style="display: flex; gap: 8px; margin-top: 4px">
        <a href="#cook" style="font-size: 13px; font-weight: 500; padding: 10px 16px; border-radius: 12px; background: {{c.primary}}; color: {{c.onPrimary}}">조리 시작</a>
        <a href="#next" style="font-size: 13px; padding: 10px 14px; border-radius: 12px; color: {{c.discLabel}}">다른 것 보기</a>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 16px; font-weight: 700">1개만 사면</div>
      <div style="display: flex; gap: 10px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 14px; background: {{c.surface}}">
          <div style="font-size: 15px; font-weight: 500">치킨 난반</div>
          <div style="font-size: 12px; color: {{c.sub}}">식초만 사면 돼요</div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 14px; background: {{c.surface}}">
          <div style="font-size: 15px; font-weight: 500">샥슈카</div>
          <div style="font-size: 12px; color: {{c.sub}}">토마토 통조림</div>
        </div>
      </div>
    </div>
  </div>

  <nav style="display: flex; justify-content: space-around; padding: 10px 12px 26px; background: {{c.nav}}">
    <a href="#fridge" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; padding: 6px 0; font-size: 11px; color: {{c.sub}}">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M5 10h14M9 7v0M9 14v0"></path></svg>
      냉장고
    </a>
    <a href="#today" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; padding: 6px 0; font-size: 11px; font-weight: 500; color: {{c.primary}}">
      <span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 15px; background: {{c.navActive}}">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 16 0v1H4z"></path><path d="M3 16h18"></path></svg>
      </span>
      오늘
    </a>
    <a href="#recipes" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; padding: 6px 0; font-size: 11px; color: {{c.sub}}">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      레시피
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"테마"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark;
    if (dark === undefined || dark === null) dark = true;
    var c = dark ? {
      bg: '#171412', surface: '#231E1B', nav: '#1E1917', navActive: '#3E2A20',
      text: '#EFE8E3', sub: '#A6988F',
      primary: '#E69070', onPrimary: '#3A160A',
      chip: '#3A2A22', chipText: '#F0C3AE', chipMuted: '#2B2522',
      discBg: '#1E2A1C', discText: '#CFE5C4', discLabel: '#9CC58E'
    } : {
      bg: '#FBF7F2', surface: '#FFFFFF', nav: '#FFFFFF', navActive: '#F4DCCF',
      text: '#2B2320', sub: '#796B63',
      primary: '#B9582F', onPrimary: '#FFFFFF',
      chip: '#F6E4DA', chipText: '#7A3A22', chipMuted: '#F1ECE6',
      discBg: '#E4EEE1', discText: '#1F3A1C', discLabel: '#3B5E36'
    };
    return { c: c };
  }
}
</script>
</body>
</html>
